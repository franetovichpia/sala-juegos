<div class="chat-wrapper">
  <div class="chat-header">
    <span class="chat-title">💬 Sala de Chat Global</span>
    <span class="chat-user">{{ usuarioActual }}</span>
  </div>

  <div class="chat-mensajes" #mensajesContainer>
    <div *ngFor="let m of mensajes"
         class="mensaje-fila"
         [class.mio]="esMio(m.usuario_email)">
      <div class="burbuja">
        <span class="mensaje-email">{{ m.usuario_email }}</span>
        <span class="mensaje-texto">{{ m.mensaje }}</span>
        <span class="mensaje-hora">{{ formatearHora(m.fecha) }}</span>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <input
      class="chat-input"
      [(ngModel)]="nuevoMensaje"
      placeholder="Escribí un mensaje..."
      (keyup.enter)="enviarMensaje()"
    />
    <button class="chat-btn" (click)="enviarMensaje()">Enviar</button>
  </div>
</div>
