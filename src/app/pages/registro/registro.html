<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="p-5 w-100" style="max-width: 420px; background: #13131f; border: 1px solid #7c3aed; border-radius: 20px;">

    <h2 class="text-center mb-4" style="font-family: 'Orbitron', sans-serif; color: #a78bfa;">REGISTRO</h2>

    <div *ngIf="errorMsg" class="alert mb-3" style="background: #2d0a0a; border: 1px solid #ef4444; color: #fca5a5; border-radius: 10px;">
      {{ errorMsg }}
    </div>

    <div class="mb-3">
      <label style="color: #94a3b8;">Nombre</label>
      <input type="text" class="form-control mt-1" placeholder="Tu nombre"
        [(ngModel)]="nombre"
        style="background: #0a0a0f; border: 1px solid #7c3aed; color: #e2e8f0;">
    </div>
    <div class="mb-3">
      <label style="color: #94a3b8;">Apellido</label>
      <input type="text" class="form-control mt-1" placeholder="Tu apellido"
        [(ngModel)]="apellido"
        style="background: #0a0a0f; border: 1px solid #7c3aed; color: #e2e8f0;">
    </div>
    <div class="mb-3">
      <label style="color: #94a3b8;">Edad</label>
      <input type="number" class="form-control mt-1" placeholder="Tu edad"
        [(ngModel)]="edad"
        style="background: #0a0a0f; border: 1px solid #7c3aed; color: #e2e8f0;">
    </div>
    <div class="mb-3">
      <label style="color: #94a3b8;">Email</label>
      <input type="email" class="form-control mt-1" placeholder="tu@email.com"
        [(ngModel)]="email"
        style="background: #0a0a0f; border: 1px solid #7c3aed; color: #e2e8f0;">
    </div>
    <div class="mb-4">
      <label style="color: #94a3b8;">Contraseña</label>
      <input type="password" class="form-control mt-1" placeholder="••••••••"
        [(ngModel)]="password"
        style="background: #0a0a0f; border: 1px solid #7c3aed; color: #e2e8f0;">
    </div>

    <button class="btn w-100 fw-bold" (click)="registrar()" [disabled]="cargando"
      style="background: #7c3aed; color: white; border-radius: 10px;">
      {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>

    <p class="text-center mt-3" style="color: #64748b; font-size: 0.9rem;">
      ¿Ya tenés cuenta? <a routerLink="/login" style="color: #a78bfa;">Iniciá sesión</a>
    </p>
  </div>
</div>
