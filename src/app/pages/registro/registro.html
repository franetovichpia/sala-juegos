<div class="mb-3">
  <label style="color: #94a3b8;">Nombre</label>
  <input type="text" class="form-control mt-1" placeholder="Tu nombre"
    [(ngModel)]="nombre"
    [style.border-color]="errores['nombre'] ? '#ef4444' : '#7c3aed'"
    style="background: #0a0a0f; color: #e2e8f0;">
  <small *ngIf="errores['nombre']" style="color: #fca5a5;">{{ errores['nombre'] }}</small>
</div>

<div class="mb-3">
  <label style="color: #94a3b8;">Apellido</label>
  <input type="text" class="form-control mt-1" placeholder="Tu apellido"
    [(ngModel)]="apellido"
    [style.border-color]="errores['apellido'] ? '#ef4444' : '#7c3aed'"
    style="background: #0a0a0f; color: #e2e8f0;">
  <small *ngIf="errores['apellido']" style="color: #fca5a5;">{{ errores['apellido'] }}</small>
</div>

<div class="mb-3">
  <label style="color: #94a3b8;">Edad</label>
  <input type="number" class="form-control mt-1" placeholder="Tu edad"
    [(ngModel)]="edad"
    [style.border-color]="errores['edad'] ? '#ef4444' : '#7c3aed'"
    style="background: #0a0a0f; color: #e2e8f0;">
  <small *ngIf="errores['edad']" style="color: #fca5a5;">{{ errores['edad'] }}</small>
</div>

<div class="mb-3">
  <label style="color: #94a3b8;">Email</label>
  <input type="email" class="form-control mt-1" placeholder="tu@email.com"
    [(ngModel)]="email"
    [style.border-color]="errores['email'] ? '#ef4444' : '#7c3aed'"
    style="background: #0a0a0f; color: #e2e8f0;">
  <small *ngIf="errores['email']" style="color: #fca5a5;">{{ errores['email'] }}</small>
</div>

<div class="mb-4">
  <label style="color: #94a3b8;">Contraseña</label>
  <input type="password" class="form-control mt-1" placeholder="••••••••"
    [(ngModel)]="password"
    [style.border-color]="errores['password'] ? '#ef4444' : '#7c3aed'"
    style="background: #0a0a0f; color: #e2e8f0;">
  <small *ngIf="errores['password']" style="color: #fca5a5;">{{ errores['password'] }}</small>
  <small style="color: #475569; font-size: 0.75rem; display: block; margin-top: 0.25rem;">
    Mínimo 8 caracteres, una mayúscula, un número y un carácter especial.
  </small>
</div>
