<div class="hero-section text-center">
  <canvas class="stars-canvas" #starsCanvas></canvas>

  <div class="grid-wrapper">
    <h1 class="glow-title">LET'S PLAY!</h1>
    <p class="subtitle">Elegí un juego y poné a prueba tus habilidades</p>

    <div class="games-grid">
      <div class="game-card">
        <img class="game-logo" src="assets/images/ahorcado.png" alt="Ahorcado">
        <h5 class="game-title">Ahorcado</h5>
        <p class="game-desc">Adivina la palabra letra por letra</p>
      </div>
      <div class="game-card">
        <img class="game-logo" src="assets/images/mayor-menor.png" alt="Mayor o Menor">
        <h5 class="game-title">Mayor o Menor</h5>
        <p class="game-desc">Adiviná si la próxima carta es mayor</p>
      </div>
      <div class="game-card">
        <img class="game-logo" src="assets/images/preguntados.png" alt="Preguntados">
        <h5 class="game-title">Preguntados</h5>
        <p class="game-desc">Respondé preguntas de trivia</p>
      </div>
      <div class="game-card">
        <img class="game-logo" src="assets/images/numerosecreto.png" alt="Número Secreto">
        <h5 class="game-title">Número Secreto</h5>
        <p class="game-desc">Adiviná el número entre 1 y 100</p>
      </div>
    </div>
  </div>
</div>
